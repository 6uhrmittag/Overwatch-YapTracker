<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YapTracker - Player profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d1016;font-family:'Nunito Sans',system-ui,sans-serif;color:#f2f4f8}
a{color:#ff9c2a}a:hover{color:#ffb85c}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: #12151c; font-variant-numeric: tabular-nums">

<nav aria-label="Main" style="width: 76px; flex-shrink: 0; box-sizing: border-box; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #0d1016; border-right: 1px solid #252b38">
<div aria-label="YapTracker" style="width: 48px; height: 48px; margin-bottom: 14px; border-radius: 14px; background: #ff9c2a; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg); box-shadow: 0 4px 0 #b86a10">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#12151c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 9l3 3 3-3"></path><path d="M12 12v2"></path></svg>
</div>
<a href="Live.dc.html" aria-label="Live" style="width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #9aa3b5">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"></path></svg>
</a>
<a href="Profile.dc.html" aria-label="Yappers" style="width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #ff9c2a; color: #12151c">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>
</a>
<a href="#" aria-label="Sessions" style="width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #9aa3b5">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
</a>
<a href="#" aria-label="Search" style="width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #9aa3b5">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
</a>
<div style="flex-grow: 1"></div>
<a href="Setup.dc.html" aria-label="Settings" style="width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #9aa3b5">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8.5"></circle></svg>
</a>
</nav>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 28px; display: flex; gap: 24px">

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<a href="Live.dc.html" style="font-size: 14px; font-weight: 800; text-decoration: none; color: #9aa3b5">← All yappers</a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 72px; line-height: .95; text-transform: uppercase">NoodleBonk</h1>
<div style="font-size: 14px; color: #9aa3b5">Also read as NoodIeBonk, NoodleBank</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .5px">Your verdict</legend>
<div style="display: flex; gap: 12px">
<sc-for list="{{verdicts}}" as="v" hint-placeholder-count="4">
<button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="{{v.style}}">
<span style="{{v.dotStyle}}"></span>{{v.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<div style="padding: 14px 16px; border-radius: 14px; background: #1a1f29; border: 1px solid #252b38"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">3</div><div style="font-size: 13px; font-weight: 700; color: #9aa3b5">matches together</div></div>
<div style="padding: 14px 16px; border-radius: 14px; background: #1a1f29; border: 1px solid #252b38"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">41</div><div style="font-size: 13px; font-weight: 700; color: #9aa3b5">yaps</div></div>
<div style="padding: 14px 16px; border-radius: 14px; background: #1a1f29; border: 1px solid #252b38"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">Sep 12</div><div style="font-size: 13px; font-weight: 700; color: #9aa3b5">first met</div></div>
<div style="padding: 14px 16px; border-radius: 14px; background: #1a1f29; border: 1px solid #252b38"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">Tue</div><div style="font-size: 13px; font-weight: 700; color: #9aa3b5">last seen</div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .5px">Yap-o-meter</span>
<span style="font-size: 15px; font-weight: 800; color: #ff9c2a">Certified yapper</span>
</div>
<div role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" aria-label="Yap-o-meter" style="height: 16px; border-radius: 999px; background: #252b38; overflow: hidden; border: 2px solid #0b0d12">
<div style="width: 72%; height: 100%; border-radius: 999px; background: repeating-linear-gradient(-45deg, #ff9c2a 0 10px, #ffb24f 10px 20px)"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #6f788c"><span>Silent type</span><span>Casual yapper</span><span>Certified yapper</span><span>Yap lord</span></div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0">
<div style="display: flex; align-items: center; gap: 10px">
<label for="notes" style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .5px">Notes</label>
<span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #7ce38b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Saved</span>
</div>
<textarea id="notes" style="flex-grow: 1; min-height: 110px; box-sizing: border-box; resize: none; padding: 14px 16px; border-radius: 14px; background: #1a1f29; border: 2px solid #343c4d; color: #f2f4f8; font: 400 16px/1.5 'Nunito Sans', sans-serif">Hype Lúcio. Says wahoo after every boop. Greet with a wahoo.
Plays EU evenings, usually duo with tortillaTank.</textarea>
</div>
</div>

<section aria-label="Their yaps" style="width: 420px; flex-shrink: 0; box-sizing: border-box; border-radius: 18px; background: #1a1f29; border: 1px solid #252b38; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .5px">Their greatest yaps</h2>
<sc-for list="{{matches}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 800; color: #9aa3b5; text-transform: uppercase; letter-spacing: .5px">{{m.when}}</div>
<sc-for list="{{m.yaps}}" as="y" hint-placeholder-count="2">
<div style="display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: #151a22">
<span style="{{y.chip}}">{{y.channel}}</span>
<span style="font-size: 15px; line-height: 1.4">{{y.text}}</span>
</div>
</sc-for>
</div>
</sc-for>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { verdict: 'bestie' }; }
  renderVals() {
    var self = this;
    var defs = [
      { id: 'bestie', label: 'Bestie', bg: '#ffc83d', ink: '#2a1d00', tilt: -4 },
      { id: 'fun', label: 'Fun', bg: '#b98cff', ink: '#1d0b3a', tilt: 3 },
      { id: 'meh', label: 'Meh', bg: '#7d8699', ink: '#12151c', tilt: -2 },
      { id: 'nope', label: 'Nope', bg: '#ff5c66', ink: '#2b0508', tilt: 4 }
    ];
    var verdicts = defs.map(function (d) {
      var on = self.state.verdict === d.id;
      return {
        label: d.label,
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ verdict: d.id }); },
        style: 'height: 48px; padding: 0 18px 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 999px; cursor: pointer; font: 800 16px \'Nunito Sans\', sans-serif; text-transform: uppercase; letter-spacing: .5px; transition: transform .15s;' +
          (on ? ' background: ' + d.bg + '; color: ' + d.ink + '; border: 2px solid ' + d.ink + '; transform: rotate(' + d.tilt + 'deg) scale(1.06); box-shadow: 0 4px 0 rgba(0,0,0,.45);'
              : ' background: #1a1f29; color: #c3cad8; border: 2px solid #343c4d; box-shadow: 0 3px 0 #0b0d12;'),
        dotStyle: 'width: 12px; height: 12px; border-radius: 50%; background: ' + (on ? d.ink : d.bg)
      };
    });
    var chip = function (c) {
      var col = { Team: '#5cc3ff', Match: '#ffae4d', Group: '#7ce38b' }[c];
      return 'flex-shrink: 0; width: 50px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: ' + col;
    };
    var matches = [
      { when: 'Tue, Sep 22 · Match 5', yaps: [
        { channel: 'Match', text: 'WAHOOOO' },
        { channel: 'Match', text: 'it is literally the first fight' } ] },
      { when: 'Sat, Sep 19 · Match 2', yaps: [
        { channel: 'Match', text: 'boop count: 14. i am unstoppable' },
        { channel: 'Match', text: 'gg you two were fun, add me' } ] },
      { when: 'Sat, Sep 12 · Match 8', yaps: [
        { channel: 'Match', text: 'why is the payload so slow, speed boost it' } ] }
    ];
    matches.forEach(function (m) { m.yaps.forEach(function (y) { y.chip = chip(y.channel); }); });
    return { verdicts: verdicts, matches: matches };
  }
}
</script>
</body>
</html>
