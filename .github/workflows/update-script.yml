name: Update script

# Checks the download bar, then installs the newest release with tools/update.ps1 into a
# throwaway folder, in Windows PowerShell 5.1 and PowerShell 7. -NoSelfUpdate: test this
# checkout's script, not the release's (#246); the self-update has its own step.
on:
  pull_request:
    paths: [tools/update.ps1, tools/test-update.ps1, tools/smoke-test.ps1, .github/workflows/update-script.yml]
  push:
    branches: [main]
    paths: [tools/update.ps1, tools/test-update.ps1, tools/smoke-test.ps1, .github/workflows/update-script.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: update.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Throwaway install root inside the checkout; stands in for %LOCALAPPDATA%\YapTracker.
      ROOT: ${{ github.workspace }}\_install
    steps:
      - uses: actions/checkout@v7
      - name: Download bar (#238, #246)
        run: ./tools/test-update.ps1
      - name: Existing data
        run: |
          New-Item -ItemType Directory -Force "$env:ROOT\data" | Out-Null
          Set-Content "$env:ROOT\data\keep.txt" 'my notes'
      - name: Fresh install
        run: ./tools/update.ps1 -InstallRoot $env:ROOT -NoStart -NoSelfUpdate
      - name: Already up to date
        run: |
          $out = ./tools/update.ps1 -InstallRoot $env:ROOT -NoStart -NoSelfUpdate 6>&1 | Out-String
          if ($out -notmatch 'already the newest') { throw "expected 'already the newest', got: $out" }
      - name: An old saved copy replaces itself (#246)
        run: |
          $copy = "$env:RUNNER_TEMP\update.ps1"
          (Get-Content ./tools/update.ps1) + '# an old saved copy' | Set-Content $copy -Encoding ASCII
          $out = & $copy -InstallRoot $env:ROOT -NoStart 6>&1 | Out-String
          if ($out -notmatch 'replaced it with the newest') { throw "expected a self-update, got: $out" }
          if ($out -notmatch 'already the newest') { throw "the new copy didn't run, got: $out" }
          $now = Get-Content $copy -Raw
          if ($now -match 'an old saved copy' -or $now -notmatch 'param\(') { throw 'update.ps1 was not replaced' }
      - name: Replace a running app and start it again
        run: |
          $before = Start-Process "$env:ROOT\app\YapTracker.exe" -PassThru
          Start-Sleep -Seconds 15
          ./tools/update.ps1 -InstallRoot $env:ROOT -Force -NoSelfUpdate
          if (-not $before.HasExited) { throw 'the running YapTracker was not closed' }
          Start-Sleep -Seconds 5
          $after = @(Get-Process YapTracker -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:ROOT\app\*" })
          if ($after.Count -eq 0) { throw 'YapTracker was not started after the update' }
          $after | Stop-Process -Force
      - name: Check result
        run: |
          if (-not (Test-Path "$env:ROOT\app\YapTracker.exe")) { throw 'YapTracker.exe missing' }
          if ((Get-Content "$env:ROOT\data\keep.txt") -ne 'my notes') { throw 'data folder was touched' }
          if (Test-Path "$env:ROOT\app.old") { throw 'app.old left behind' }
          Get-Content "$env:ROOT\app\release.txt"
      - name: Installed app starts
        timeout-minutes: 5
        run: ./tools/smoke-test.ps1 -Exe "$env:ROOT\app\YapTracker.exe"
