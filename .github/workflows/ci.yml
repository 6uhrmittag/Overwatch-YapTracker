name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A stable release (#514): the promote workflow runs this whole CI at the tested pre-release's
  # commit, with the stable version stamped into the app. No pre-release is published then.
  workflow_call:
    inputs:
      ref:
        description: "The commit to build: the tested pre-release's"
        type: string
        required: true
      version:
        description: "The stable version to stamp in, e.g. 1.0.0"
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read  # which files a PR changes: docs only? (#493)

env:
  # Pre-release versions (#454, CLAUDE.md -> Release policy). Until the first stable release:
  # v0.<MILESTONE>.<run_number>, bump MILESTONE when a milestone is closed. Once v1.0.0 is out,
  # set NEXT_VERSION to the next stable one ("1.1.0"): every build is then v1.1.0-pre.<run>,
  # until that one is promoted and NEXT_VERSION moves on ("1.2.0", or "1.1.1" for a patch).
  MILESTONE: "5"
  NEXT_VERSION: "1.1.0"

jobs:
  changes:
    # A docs-only PR (only *.md, docs/, issue templates) skips the Windows jobs, and the Linux
    # job runs just the tests that read docs (#493). Pushes to main and promote builds never skip.
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || [ -n "${{ inputs.version }}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # renames count with their old name too: code moved into docs/ is still a code change
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.number }}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          # THIRD_PARTY_NOTICES.md ships inside the app: not just docs
          code=$( { grep -vE '\.md$|^docs/|^\.github/ISSUE_TEMPLATE/' <<< "$files"; grep -x THIRD_PARTY_NOTICES.md <<< "$files"; } || true)
          if [ -z "$files" ] || [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Only docs changed: $(tr '\n' ' ' <<< "$files")"
          fi

  test:
    name: Lint & tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}  # empty outside the promote workflow: the usual commit
      - &python
        uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
      # The whole virtualenv is cached (#493): restoring it beats installing from the pip cache.
      # Keyed on the job (two Windows images), the exact Python and the pins; the install step
      # below adds anything pyproject.toml asks for that the cached one doesn't have yet.
      - &venv-cache
        name: Cached virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ github.job }}-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('packaging/constraints.txt') }}
      - &venv
        name: Use the virtualenv (made on a cache miss)
        shell: bash
        run: |
          [ -d .venv ] || python -m venv .venv
          python -c "import os; d = os.path.abspath('.venv/Scripts' if os.name == 'nt' else '.venv/bin'); open(os.environ['GITHUB_PATH'], 'a').write(d + '\n')"
      - name: Install (exact versions, #309)
        run: python -m pip install -e .[dev] -c packaging/constraints.txt
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: ruff check . && ruff format --check .
      - name: Tests in parallel, failing under 80 % coverage (#310, #493)
        if: needs.changes.outputs.code == 'true'
        run: pytest -n auto --cov=yaptracker --cov-report=term --cov-fail-under=80
      - name: Coverage per file in the job summary
        if: always() && needs.changes.outputs.code == 'true'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Docs only - just the tests that read docs (no real names, export schema)
        if: needs.changes.outputs.code != 'true'
        run: pytest -n auto tests/test_no_real_names.py tests/test_example_export.py tests/test_export_all.py tests/test_export_markdown.py

  older-windows:
    # Server 2022 is build 20348: no capture-rate setting, like Windows 10 (#216). The capture
    # must start without it and gate the frames itself.
    name: Capture without the rate setting (Server 2022)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}  # empty outside the promote workflow: the usual commit
      - *python
      - *venv-cache
      - *venv
      # The app as a real (non-editable) install, always fresh from this checkout: the cached
      # virtualenv may hold an older one.
      - &install-app
        name: Install (exact versions, #309)
        shell: bash
        run: |
          python -m pip install .[dev] pyinstaller -c packaging/constraints.txt
          python -m pip install --no-deps --force-reinstall .
      - run: pytest tests/test_capture_windows.py tests/test_capture_gdi_windows.py tests/test_system_info_windows.py -v
      - name: What capturing costs without the rate setting (#248; on main only, #493)
        if: github.event_name != 'pull_request'
        run: python tools/capture_cost.py --seconds 5

  windows-tests:
    # Next to the build, not in it, so they don't wait for each other (#493).
    name: Windows tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}  # empty outside the promote workflow: the usual commit
      - *python
      - *venv-cache
      - *venv
      - *install-app
      - name: Windows-only tests (Windows OCR, WGC capture, hotkeys, autostart, system info)
        run: pytest tests/test_ocr_windows.py tests/test_capture_windows.py tests/test_hotkeys_windows.py tests/test_autostart_windows.py tests/test_process_windows.py tests/test_priority_windows.py tests/test_system_info_windows.py tests/test_capture_gdi_windows.py tests/test_window_place_windows.py tests/test_update_now_windows.py tests/test_cpu_parts.py tests/test_images.py -v

  build:
    name: Windows build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}  # empty outside the promote workflow: the usual commit
      - name: Set version
        id: version
        run: |
          $stable = "${{ inputs.version }}"  # the promote workflow's stamped stable build (#514)
          $version = if ($stable) { $stable } elseif ($env:NEXT_VERSION) { "$env:NEXT_VERSION-pre.${{ github.run_number }}" } else { "0.$env:MILESTONE.${{ github.run_number }}" }
          if (-not $stable -and "${{ github.event_name }}" -eq "pull_request") { $version += "+pr${{ github.event.number }}" }
          Set-Content src/yaptracker/_version.py "__version__ = `"$version`""
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - *python
      - *venv-cache
      - *venv
      - *install-app
      - name: Installed versions (exactly packaging/constraints.txt, #309)
        run: pip freeze
      - name: Plain onnxruntime, no DirectML in the app (GPU OCR is out of v1, #219)
        run: python -c "import onnxruntime as o; p = o.get_available_providers(); print(o.__version__, p); assert 'DmlExecutionProvider' not in p"
      - name: What capturing costs with the rate setting, for comparison (#248; on main only, #493)
        if: github.event_name != 'pull_request'
        run: python tools/capture_cost.py --seconds 5
      - run: pyinstaller --noconfirm packaging/yaptracker.spec
      - name: Licenses ship with the app
        run: |
          foreach ($f in 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/nicegui') {
            if (-not (Test-Path "dist/YapTracker/$f")) { throw "dist/YapTracker/$f missing" }
          }
          $dml = Get-ChildItem dist/YapTracker -Recurse -Filter DirectML.dll  # no GPU OCR (#219)
          if ($dml) { throw "DirectML.dll is in the app, but GPU OCR is out of v1" }
          $lists = Get-ChildItem dist/YapTracker -Recurse -Filter game_lists.json  # (#276)
          if (-not $lists) { throw "game_lists.json is not in the app: modes and maps would be none" }
          $script = Get-ChildItem dist/YapTracker -Recurse -Filter update.ps1  # Update now (#46)
          if (-not $script) { throw "update.ps1 is not in the app: Update now couldn't run" }
      - name: Smoke test (window opens and loads the page)
        timeout-minutes: 5
        run: ./tools/smoke-test.ps1 -Exe dist/YapTracker/YapTracker.exe
      - name: Show app log
        if: always()
        run: Get-Content "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -ErrorAction SilentlyContinue
      - name: No errors in the app log (the game isn't running here)
        run: |
          if (Select-String -Path "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -Pattern 'Traceback|ERROR' -Quiet) {
            throw 'the app logged an error (see app log above)'
          }
      - name: A stable build says its version and collects no debug samples (#514)
        if: inputs.version
        run: |
          $log = Get-Content "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -Raw
          if ($log -notmatch [regex]::Escape("YapTracker v$env:VERSION |")) { throw "the app doesn't say v$env:VERSION" }
          if ($log -notmatch 'debug samples off') { throw 'debug samples are on by default in a stable release' }
      - name: Window got the YapTracker icon
        run: |
          if (Select-String -Path "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -Pattern 'Could not set native' -Quiet) {
            throw 'NiceGUI could not set the window/taskbar icon (see app log)'
          }
      - name: Start with Windows, and only one instance
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path dist/YapTracker/YapTracker.exe).Path
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $first = Start-Process $exe -ArgumentList '--autostart on' -PassThru
          try {
            Start-Sleep -Seconds 15
            $entry = (Get-ItemProperty $run -Name YapTracker -ErrorAction Stop).YapTracker
            if ($entry -ne "`"$exe`" --background") { throw "Run entry is: $entry" }
            $second = Start-Process $exe -PassThru
            if (-not $second.WaitForExit(20000)) { throw 'the second YapTracker did not exit' }
            if ($first.HasExited) { throw 'the first YapTracker died' }
          } finally {
            Get-Process YapTracker -ErrorAction SilentlyContinue | Stop-Process -Force
            Remove-ItemProperty $run -Name YapTracker -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        with:
          name: YapTracker-${{ env.VERSION }}-win64
          path: dist/YapTracker/
          retention-days: 14

  release:
    name: Pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read  # the merged PR's "What you can see now" becomes the notes (#239)
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: YapTracker-${{ env.VERSION }}-win64
          path: app
      - name: Zip the app folder
        run: cd app && zip -qr "../YapTracker-$VERSION-win64.zip" .
      - name: Publish pre-release v${{ env.VERSION }}
        run: |
          # Release notes (#239): what the merged PR says under "What you can see now", in the
          # app's own words; one merge to main is one release.
          previous=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // null' > pr.json
          python3 tools/release_notes.py --pr pr.json --repo "$GITHUB_REPOSITORY" --tag "v$VERSION" \
            --previous "$previous" --subject "$(git log -1 --format=%s)" > notes.md
          cat notes.md
          gh release create "v$VERSION" "YapTracker-$VERSION-win64.zip" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "YapTracker $VERSION" --notes-file notes.md
