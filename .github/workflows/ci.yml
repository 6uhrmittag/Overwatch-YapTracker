name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # v0.<milestone>.<run_number> - bump when a milestone is closed.
  MILESTONE: "5"

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  older-windows:
    # Server 2022 is build 20348: no capture-rate setting, like Windows 10 (#216). The capture
    # must start without it and gate the frames itself.
    name: Capture without the rate setting (Server 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[dev]
      - run: pytest tests/test_capture_windows.py tests/test_system_info_windows.py -v

  build:
    name: Windows build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set version
        id: version
        run: |
          $version = "0.$env:MILESTONE.${{ github.run_number }}"
          if ("${{ github.event_name }}" -eq "pull_request") { $version += "+pr${{ github.event.number }}" }
          Set-Content src/yaptracker/_version.py "__version__ = `"$version`""
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: pip install .[dev] pyinstaller
      - name: OCR on the GPU is possible (DirectML build of onnxruntime, CPU unchanged, #208)
        run: |
          pip uninstall -y onnxruntime
          pip install onnxruntime-directml
          python -c "import onnxruntime as o; p = o.get_available_providers(); print(o.__version__, p); assert 'DmlExecutionProvider' in p"
      - name: Windows-only tests (Windows OCR, WGC capture, hotkeys, autostart, system info)
        run: pytest tests/test_ocr_windows.py tests/test_capture_windows.py tests/test_hotkeys_windows.py tests/test_autostart_windows.py tests/test_process_windows.py tests/test_priority_windows.py tests/test_system_info_windows.py -v
      - run: pyinstaller --noconfirm packaging/yaptracker.spec
      - name: Licenses ship with the app
        run: |
          foreach ($f in 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/nicegui') {
            if (-not (Test-Path "dist/YapTracker/$f")) { throw "dist/YapTracker/$f missing" }
          }
          $dml = Get-ChildItem dist/YapTracker -Recurse -Filter DirectML.dll  # GPU OCR (#208)
          if (-not $dml) { throw "DirectML.dll missing from the app" }
      - name: Smoke test (window opens and loads the page)
        timeout-minutes: 5
        run: ./tools/smoke-test.ps1 -Exe dist/YapTracker/YapTracker.exe
      - name: Show app log
        if: always()
        run: Get-Content "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -ErrorAction SilentlyContinue
      - name: No errors in the app log (the game isn't running here)
        run: |
          if (Select-String -Path "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -Pattern 'Traceback|ERROR' -Quiet) {
            throw 'the app logged an error (see app log above)'
          }
      - name: Window got the YapTracker icon
        run: |
          if (Select-String -Path "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -Pattern 'Could not set native' -Quiet) {
            throw 'NiceGUI could not set the window/taskbar icon (see app log)'
          }
      - name: Start with Windows, and only one instance
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path dist/YapTracker/YapTracker.exe).Path
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $first = Start-Process $exe -ArgumentList '--autostart on' -PassThru
          try {
            Start-Sleep -Seconds 15
            $entry = (Get-ItemProperty $run -Name YapTracker -ErrorAction Stop).YapTracker
            if ($entry -ne "`"$exe`" --background") { throw "Run entry is: $entry" }
            $second = Start-Process $exe -PassThru
            if (-not $second.WaitForExit(20000)) { throw 'the second YapTracker did not exit' }
            if ($first.HasExited) { throw 'the first YapTracker died' }
          } finally {
            Get-Process YapTracker -ErrorAction SilentlyContinue | Stop-Process -Force
            Remove-ItemProperty $run -Name YapTracker -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        with:
          name: YapTracker-${{ env.VERSION }}-win64
          path: dist/YapTracker/
          retention-days: 14

  release:
    name: Pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: YapTracker-${{ env.VERSION }}-win64
          path: app
      - name: Zip the app folder
        run: cd app && zip -qr "../YapTracker-$VERSION-win64.zip" .
      - name: Publish pre-release v${{ env.VERSION }}
        run: |
          # Release notes = merged PR titles since the previous (pre-)release.
          previous=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          gh release create "v$VERSION" "YapTracker-$VERSION-win64.zip" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "YapTracker $VERSION" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
