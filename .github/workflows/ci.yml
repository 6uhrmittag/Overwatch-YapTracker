name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # v0.<milestone>.<run_number> - bump when a milestone is closed.
  MILESTONE: "0"

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  build:
    name: Windows build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set version
        id: version
        run: |
          $version = "0.$env:MILESTONE.${{ github.run_number }}"
          if ("${{ github.event_name }}" -eq "pull_request") { $version += "+pr${{ github.event.number }}" }
          Set-Content src/yaptracker/_version.py "__version__ = `"$version`""
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm packaging/yaptracker.spec
      - name: Smoke test (window opens and loads the page)
        timeout-minutes: 5
        run: ./tools/smoke-test.ps1 -Exe dist/YapTracker/YapTracker.exe
      - name: Show app log
        if: always()
        run: Get-Content "$env:LOCALAPPDATA/YapTracker/data/logs/yaptracker.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: YapTracker-${{ env.VERSION }}-win64
          path: dist/YapTracker/
          retention-days: 14

  release:
    name: Pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: YapTracker-${{ env.VERSION }}-win64
          path: app
      - name: Zip the app folder
        run: cd app && zip -qr "../YapTracker-$VERSION-win64.zip" .
      - name: Publish pre-release v${{ env.VERSION }}
        run: |
          # Release notes = merged PR titles since the previous (pre-)release.
          previous=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          gh release create "v$VERSION" "YapTracker-$VERSION-win64.zip" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "YapTracker $VERSION" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
