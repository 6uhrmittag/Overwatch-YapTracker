[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaptracker"
description = "Remember who you played Overwatch with - and what they said."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "nicegui>=3.17,<4",
    # Native window (WebView2). Linux/WSL dev uses --dev browser mode instead.
    "pywebview>=5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
yaptracker = "yaptracker.__main__:main"

[tool.hatch.version]
path = "src/yaptracker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yaptracker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Historical record of the GitHub setup, not app code.
extend-exclude = ["tools/github-setup"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Nested `with` blocks mirror the NiceGUI layout tree; merging them hurts readability.
ignore = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
